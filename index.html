<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brat Burger | Cortes Nobres & Experiência Urbana</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fonte Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300&display=swap" rel="stylesheet">
  
  <!-- Apontando para o seu arquivo style.css correto -->
  <link rel="stylesheet" href="style.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Montserrat', 'sans-serif'] },
          colors: { brat: { gold: '#D4AF37', dark: '#08080A', card: '#121216', border: '#22222A' } }
        }
      }
    }
  </script>

  <style>
    html, body { font-family: 'Montserrat', sans-serif; background-color: #08080A; color: #f4f4f5; margin: 0; padding: 0; width: 100%; min-height: 100vh; overflow-x: hidden; }
    .optical-frame { position: relative; width: 100%; border-radius: 1rem; overflow: hidden; background-color: #08080A; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85); }
    .optical-lens-img { width: 100%; height: auto; display: block; transform-origin: center center; will-change: filter, transform, opacity; }
    
    .vertical-media-frame { position: relative; width: 100%; height: 320px; border-radius: 1rem; overflow: hidden; background-color: #000; }
    @media (min-width: 768px) { .vertical-media-frame { height: 450px; } }
    .vertical-media-frame img { width: 100%; height: 100%; object-fit: cover; object-position: center; transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
    .vertical-media-frame:hover img { transform: scale(1.03); }

    /* ANIMAÇÃO CSS DA CORTINA */
    @keyframes forceRemoveSplash {
      0% { opacity: 1; visibility: visible; }
      85% { opacity: 1; visibility: visible; }
      99% { opacity: 0; visibility: visible; }
      100% { opacity: 0; visibility: hidden; pointer-events: none; z-index: -100; display: none; }
    }
    #splash-screen { animation: forceRemoveSplash 5.5s forwards !important; }
    #splash-cols { transition: opacity 0.4s ease-in-out; }
    .splash-col { opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease-out, transform 0.8s ease-out; }
    #splash-dot { opacity: 0; transform: translate(-50%, -50%) scale(0); transition: transform 0.9s cubic-bezier(0.85, 0, 0.15, 1), opacity 0.5s ease; }
  </style>
</head>
